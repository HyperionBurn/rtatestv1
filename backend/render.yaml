services:
  - type: web
    name: rtatest-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: PREDICTHQ_API_KEY
        sync: false
